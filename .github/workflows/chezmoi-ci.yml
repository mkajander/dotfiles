name: Chezmoi Apply

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate-chezmoi:
    name: Validate chezmoi on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chezmoi (Unix)
        if: runner.os != 'Windows'
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iwr https://get.chezmoi.io/ps1 -useb | powershell -c -
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Chezmoi doctor
        if: runner.os != 'Windows'
        run: |
          chezmoi -S "$GITHUB_WORKSPACE" -D "$HOME" doctor

      - name: Chezmoi doctor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chezmoi -S "$env:GITHUB_WORKSPACE" -D "$env:USERPROFILE" doctor

      - name: Validate template rendering
        if: runner.os != 'Windows'
        run: |
          chezmoi -S "$GITHUB_WORKSPACE" -D "$HOME" apply --dry-run --verbose
          chezmoi -S "$GITHUB_WORKSPACE" -D "$HOME" diff

      - name: Validate template rendering (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          chezmoi -S "$env:GITHUB_WORKSPACE" -D "$env:USERPROFILE" apply --dry-run --verbose
          chezmoi -S "$env:GITHUB_WORKSPACE" -D "$env:USERPROFILE" diff
